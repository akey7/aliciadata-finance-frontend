[project]
name = "aliciadata-finance-frontend"
version = "0.1.0"
description = "Gradio frontend for portfolio optimization and ARIMA time series results."
# Must include the exact version in .python-version and the Dockerfile's
# base image (3.13.5); only a minor-version upgrade changes this line.
requires-python = "==3.13.*"
dependencies = [
    "boto3",
    "botocore",
    # Pinned on purpose: bumping Gradio is a deliberate change (see CLAUDE.md).
    "gradio==6.30.0",
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "python-dotenv",
    "pyyaml",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "pre-commit",
    "pytest",
    "sphinx",
]

[tool.uv]
# This is an app, not an installable package, so uv installs only its
# dependencies.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
