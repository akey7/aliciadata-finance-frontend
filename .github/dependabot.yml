# Dependabot version updates. Each update arrives as a pull request, so the
# tests workflow checks it before it can be merged.
version: 2
updates:
  # The actions in .github/workflows/, pinned by commit SHA. Dependabot
  # updates both the SHA and the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies in pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Gradio is pinned on purpose; bumping it is a deliberate change.
      - dependency-name: "gradio"
    groups:
      # One weekly pull request for all minor and patch updates. Major
      # updates (such as pandas 2 to 3) still arrive one per pull request,
      # so each can be checked on its own.
      python-minor-and-patch:
        update-types: ["minor", "patch"]
