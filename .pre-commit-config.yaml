# Keeps uv.lock in sync with pyproject.toml on every commit.
# Install the hook once with: uv run pre-commit install
# Update `rev` to the latest uv release with: uv run pre-commit autoupdate
# (keep it equal to the uv version in the Dockerfile and the tests workflow).
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      # Re-lock when pyproject.toml changes.
      - id: uv-lock
